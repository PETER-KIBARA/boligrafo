services:
  - type: web
    name: boligrafo-backend
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn bloodpressure.wsgi
    postDeployCommand: python manage.py migrate
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.13.4"
